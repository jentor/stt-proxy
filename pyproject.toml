[project]
name = "stt-proxy"
version = "0.1.0"
description = "OpenAI Audio API compatible proxy for Yandex SpeechKit"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "stt-proxy maintainers" },
]
license = { text = "MIT" }
keywords = ["stt", "speech-to-text", "openai", "yandex", "proxy"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "platformdirs>=4.0",
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "yandex-ai-studio-sdk>=0.20.0",
]

[project.scripts]
stt-proxy = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
