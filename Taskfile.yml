# https://taskfile.dev
#
# Main task catalogue for stt-proxy — end-user tasks only.
# Developer-only tasks (lint, format, test, auto-reload server, etc.) live
# in Taskfile.dev.yml and are brought in under the `dev:` namespace by the
# include below, so they appear in `task --list` as `dev:lint`, `dev:test`,
# `dev:serve`, etc. — clearly distinct from the end-user tasks here.

version: "3"

includes:
  dev:
    taskfile: Taskfile.dev.yml
    dir: .

vars:
  PYTHON: '{{ default "python" .PYTHON }}'
  UV: '{{ default "uv" .UV }}'

# All tasks that run uv-managed Python code pass .env via UV_ENV_FILE. uv
# reads it into the subprocess environment so STT_PROXY_* values become
# visible to `env | grep` for debugging; pydantic-settings in
# app/config.py ALSO reads .env via env_file as a safety net, so the
# values land in the Settings object even when uv is invoked without this
# task (e.g. bare `python -m app.main`).
#
# If .env doesn't exist, uv errors with "No environment file found at:
# `.env`" before any Python code runs. Copy .env.example to .env first.
#
# Install: `task install-tool` registers a global `stt-proxy` command
# (start / stop / logs / config). The daemon launched by `stt-proxy start`
# ignores .env by design — it only sees env vars exported in the calling
# shell (plus the optional ~/.config/stt-proxy/config.toml file). Dev
# workflow setup needs no explicit sync task — `uv run` auto-syncs .venv
# on first use; `uv sync` is one word when you want it explicit.

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  install-tool:
    desc: "Install stt-proxy as a local uv tool (creates `stt-proxy` console command)"
    cmds:
      - "{{.UV}} tool install -e ."

  run:
    desc: "Run the proxy in the foreground (no auto-reload). Reads STT_PROXY_* env vars from .env or shell. For auto-reload use `task dev:serve`; for a detached background daemon use `stt-proxy start` after `task install-tool`."
    env:
      UV_ENV_FILE: .env
    cmds:
      - "{{.UV}} run python -m app.main"
