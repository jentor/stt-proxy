# https://taskfile.dev
#
# Main task catalogue for stt-proxy.
# Dev-only tasks (auto-reload, format, etc.) live in Taskfile.dev.yml and
# are merged in automatically by go-task.

version: "3"

includes:
  dev:
    taskfile: Taskfile.dev.yml
    dir: .

vars:
  PYTHON: '{{ default "python" .PYTHON }}'
  UV: '{{ default "uv" .UV }}'

# All tasks that run uv-managed Python code pass .env via UV_ENV_FILE. uv
# reads it into the subprocess environment so STT_PROXY_* values become
# visible to `env | grep` for debugging; pydantic-settings in
# app/config.py ALSO reads .env via env_file as a safety net, so the
# values land in the Settings object even when uv is invoked without this
# task (e.g. bare `python -m app.main`).
#
# If .env doesn't exist, uv errors with "No environment file found at:
# `.env`" before any Python code runs. Copy .env.example to .env first.
#
# Two install paths exist:
#   * `task install-tool`  — `uv tool install -e .` registers a global
#                            `stt-proxy` console command (start/stop/logs).
#                            The daemon launched by `stt-proxy start`
#                            ignores .env by design — it only sees env vars
#                            exported in the calling shell.
#   * `task install-deps`  — `uv sync` populates .venv for the foreground
#                            dev tasks (`task dev` / `task run` / `task test`).
#                            Usually unnecessary — `uv run` auto-syncs.

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  install-tool:
    desc: "Install stt-proxy as a local uv tool (creates `stt-proxy` console command)"
    cmds:
      - "{{.UV}} tool install -e ."

  install-deps:
    desc: "Sync project dependencies to .venv (for `task dev`/`task run`/`task test`). Usually unnecessary — `uv run` auto-syncs."
    cmds:
      - "{{.UV}} sync"

  update:
    desc: "Upgrade lockfile and reinstall"
    cmds:
      - "{{.UV}} lock --upgrade"
      - "{{.UV}} sync"

  add:
    desc: "Add a runtime dependency (use --dev for development deps)"
    cmds:
      - "{{.UV}} add {{.CLI_ARGS}}"
    silent: false

  remove:
    desc: "Remove a dependency"
    cmds:
      - "{{.UV}} remove {{.CLI_ARGS}}"
    silent: false

  run:
    desc: "Run the proxy in production mode. Reads STT_PROXY_* env vars from .env or shell."
    env:
      UV_ENV_FILE: .env
    cmds:
      - "{{.UV}} run python -m app.main"

  test:
    desc: "Run pytest (no tests yet, will exit 5)"
    env:
      UV_ENV_FILE: .env
    cmds:
      - "{{.UV}} run pytest -v {{.CLI_ARGS}}"
    silent: false

  test-quick:
    desc: "Quick import + smoke check without pytest (auto-loads .env)"
    env:
      UV_ENV_FILE: .env
    cmds:
      - "{{.UV}} run python -c 'from app.main import create_app; app = create_app(); print(\"app imports OK, routes:\", [r.path for r in app.routes if hasattr(r, \"path\")][:5])'"

  lint:
    desc: "Run ruff lint"
    cmds:
      - "{{.UV}} run ruff check app {{.CLI_ARGS}}"

  format-check:
    desc: "Check formatting without changing files"
    cmds:
      - "{{.UV}} run ruff format --check app"

  clean:
    desc: "Remove caches and build artifacts"
    cmds:
      - "rm -rf .pytest_cache .ruff_cache .venv __pycache__ */__pycache__ */*/__pycache__"
      - "find . -name '*.pyc' -delete"