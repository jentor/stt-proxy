# https://taskfile.dev
#
# Main task catalogue for stt-proxy.
# Dev-only tasks (auto-reload, format, etc.) live in Taskfile.dev.yml and
# are merged in automatically by go-task.

version: "3"

includes:
  dev:
    taskfile: Taskfile.dev.yml
    dir: .

vars:
  PYTHON: '{{ default "python" .PYTHON }}'
  UV: '{{ default "uv" .UV }}'

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  install:
    desc: "Resolve and sync project dependencies via uv"
    cmds:
      - "{{.UV}} sync"

  update:
    desc: "Upgrade lockfile and reinstall"
    cmds:
      - "{{.UV}} lock --upgrade"
      - "{{.UV}} sync"

  add:
    desc: "Add a runtime dependency (use --dev for development deps)"
    cmds:
      - "{{.UV}} add {{.CLI_ARGS}}"
    silent: false

  remove:
    desc: "Remove a dependency"
    cmds:
      - "{{.UV}} remove {{.CLI_ARGS}}"
    silent: false

  run:
    desc: "Run the proxy in production mode. Reads HOST/PORT (and creds) from .env or shell env."
    cmds:
      - "{{.UV}} run python -m app.main"

  test:
    desc: "Run pytest (adds a default [] suite if no tests exist yet)"
    cmds:
      - "{{.UV}} run pytest -v {{.CLI_ARGS}}"
    silent: false

  test-quick:
    desc: "Run a quick import + smoke check without pytest (reads .env automatically via pydantic-settings)"
    cmds:
      - cmd: |
          if [ -z "${YANDEX_API_KEY:-}${SBER_SALUTE_SPEECH_API_KEY:-}" ]; then
            echo 'set at least one provider env var before running test-quick' >&2
            exit 2
          fi
      - "{{.UV}} run python -c 'from app.main import create_app; app = create_app(); print(\"app imports OK, routes:\", [r.path for r in app.routes if hasattr(r, \"path\")][:5])'"

  lint:
    desc: "Run ruff lint"
    cmds:
      - "{{.UV}} run ruff check app {{.CLI_ARGS}}"

  format-check:
    desc: "Check formatting without changing files"
    cmds:
      - "{{.UV}} run ruff format --check app"

  clean:
    desc: "Remove caches and build artifacts"
    cmds:
      - "rm -rf .pytest_cache .ruff_cache .venv __pycache__ */__pycache__ */*/__pycache__"
      - "find . -name '*.pyc' -delete"
